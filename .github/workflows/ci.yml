name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Mobile CI is paused for now; remove this `if` to re-enable it.
  mobile:
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=APP_ENV=dev

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jcb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jcb_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jcb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      # Fails if schema.prisma changed without a migration.
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm test
      - run: npm run build

  # Publishes the admin portal to Firebase Hosting once its checks pass on main.
  deploy-hosting:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: admin
    runs-on: ubuntu-latest
    concurrency: deploy-hosting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            firebase/package-lock.json
      - run: npm ci --prefix admin
      # firebase-tools only: Firebase Hosting serves the static portal.
      - run: npm ci --prefix firebase
      # Must contain VITE_API_BASE_URL=https://<api-host>/api/v1
      - name: Write admin/.env.local
        run: printf '%s\n' "$ADMIN_ENV_LOCAL" > admin/.env.local
        env:
          ADMIN_ENV_LOCAL: ${{ secrets.ADMIN_ENV_LOCAL }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm run deploy:hosting
        working-directory: firebase
