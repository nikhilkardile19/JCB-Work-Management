name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=APP_ENV=dev

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - run: npm run test:rules
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build
      - run: npm run test:functions

  # Publishes the admin portal to Firebase Hosting once its checks pass on main.
  deploy-hosting:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: admin
    runs-on: ubuntu-latest
    concurrency: deploy-hosting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            firebase/package-lock.json
      - run: npm ci --prefix admin
      - run: npm ci --prefix firebase
      - name: Write admin/.env.local
        run: printf '%s\n' "$ADMIN_ENV_LOCAL" > admin/.env.local
        env:
          ADMIN_ENV_LOCAL: ${{ secrets.ADMIN_ENV_LOCAL }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm run deploy:hosting
        working-directory: firebase
